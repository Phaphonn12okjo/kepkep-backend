version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose    # HTTP response bodies are closed (AI and push clients)
    - errorlint    # errors compared with errors.Is / errors.As, wrapped with %w
    - gosec        # common security mistakes
    - misspell
    - noctx        # HTTP requests carry a context (timeouts)

formatters:
  enable:
    - gofmt
    - goimports
