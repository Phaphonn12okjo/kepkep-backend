# Local development services. MinIO is added in Phase 6.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kepkep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kepkep}
      POSTGRES_DB: ${POSTGRES_DB:-kepkep}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kepkep} -d ${POSTGRES_DB:-kepkep}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
