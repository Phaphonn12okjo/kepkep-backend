# sqlc reads the goose migrations as the schema and the queries in db/queries.
# Used from Phase 2. Generated code goes to internal/platform/db/sqlc — never edit it by hand.
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: internal/platform/db/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
